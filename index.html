<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Liga Kotak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@700&family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#E8EFE9;
  --blob1:#8FD6A0; --blob2:#93C4F4; --blob3:#F3D9A4;
  --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.82);
  --edge:rgba(255,255,255,.8); --hi:rgba(255,255,255,.95);
  --hair:rgba(20,34,26,.09); --chip:rgba(20,34,26,.06);
  --fg:#111A14; --muted:#4E5E55; --faint:#74847A;
  --accent:#1E8A3C; --accent-soft:rgba(30,138,60,.12); --accent-fg:#FFFFFF; --up:#1B7F3A;
  --medal-fg:#1D1A10;
  --shadow:0 10px 36px rgba(26,52,34,.12);
  --f-display:'Silkscreen',ui-monospace,monospace;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F0C;
    --blob1:#1F7A44; --blob2:#1E4F95; --blob3:#6E5420;
    --glass:rgba(30,42,34,.5); --glass-strong:rgba(42,58,48,.78);
    --edge:rgba(255,255,255,.14); --hi:rgba(255,255,255,.16);
    --hair:rgba(255,255,255,.09); --chip:rgba(255,255,255,.07);
    --fg:#E9F0E8; --muted:#A5B3A9; --faint:#79887E;
    --accent:#6CC477; --accent-soft:rgba(108,196,119,.17); --accent-fg:#0A1A0E; --up:#6CC477;
    --shadow:0 10px 36px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F0C;
  --blob1:#1F7A44; --blob2:#1E4F95; --blob3:#6E5420;
  --glass:rgba(30,42,34,.5); --glass-strong:rgba(42,58,48,.78);
  --edge:rgba(255,255,255,.14); --hi:rgba(255,255,255,.16);
  --hair:rgba(255,255,255,.09); --chip:rgba(255,255,255,.07);
  --fg:#E9F0E8; --muted:#A5B3A9; --faint:#79887E;
  --accent:#6CC477; --accent-soft:rgba(108,196,119,.17); --accent-fg:#0A1A0E; --up:#6CC477;
  --shadow:0 10px 36px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.5;
  padding-block:20px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.bg{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none}
.bg i{position:absolute; border-radius:50%; filter:blur(80px); opacity:.6}
.bg i:nth-child(1){width:50vmax; height:50vmax; left:-14vmax; top:-14vmax; background:var(--blob1)}
.bg i:nth-child(2){width:44vmax; height:44vmax; right:-16vmax; top:24vh; background:var(--blob2)}
.bg i:nth-child(3){width:40vmax; height:40vmax; left:10vw; bottom:-20vmax; background:var(--blob3)}
.wrap{max-width:780px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0; padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button:disabled{cursor:default; opacity:.6}

.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(170%); backdrop-filter:blur(24px) saturate(170%);
  border:1px solid var(--edge); border-radius:24px;
  box-shadow:var(--shadow), inset 0 1px 0 var(--hi);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:var(--glass-strong)}
}

.seg{position:relative; display:flex; padding:4px; border-radius:999px; background:var(--chip); border:1px solid var(--hair)}
.seg.glass{background:var(--glass); border-color:var(--edge)}
.seg button{position:relative; z-index:1; flex:1 1 0; min-width:0; padding:8px 10px; border-radius:999px; font-weight:600; font-size:13px; color:var(--muted); white-space:nowrap; transition:color .2s}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{color:var(--fg)}
.seg .thumb{
  position:absolute; top:4px; bottom:4px; left:4px; width:calc((100% - 8px) / var(--n,2)); border-radius:999px;
  background:var(--glass-strong); border:1px solid var(--edge);
  box-shadow:0 2px 10px rgba(0,0,0,.12), inset 0 1px 0 var(--hi);
  transform:translateX(calc(var(--i,0) * 100%)); transition:transform .38s cubic-bezier(.3,1.25,.5,1);
}
.seg.main{max-width:460px}
.seg.mini{width:96px}
.seg.mini button{padding:6px 0; font-size:12px}

.top{display:flex; align-items:center; justify-content:space-between; gap:10px}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.mark{display:grid; grid-template-columns:repeat(2,9px); grid-template-rows:repeat(2,9px); gap:1px; border-radius:3px; overflow:hidden; flex:0 0 auto}
.mark i{display:block}
.mark i:nth-child(1){background:#5B8C3A} .mark i:nth-child(2){background:#8B5E3C}
.mark i:nth-child(3){background:#7C8590} .mark i:nth-child(4){background:#2F5FA8}
.brand b{font-family:var(--f-display); font-size:17px; letter-spacing:.03em; white-space:nowrap}
.ctl{display:flex; align-items:center; gap:8px}
.icon{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:var(--fg)}
.icon svg{width:18px; height:18px}
.moon{display:none}
:root[data-theme="dark"] .sun{display:none}
:root[data-theme="dark"] .moon{display:block}
.meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-family:var(--f-num); font-size:12px; color:var(--muted); margin-top:-8px}
.tag{font-family:var(--f-body); font-size:11px; letter-spacing:.05em; text-transform:uppercase; padding:3px 9px; border-radius:999px; background:var(--chip); border:1px solid var(--hair); color:var(--muted); font-weight:600}

.view{display:flex; flex-direction:column; gap:22px}
.hero{display:flex; flex-direction:column; gap:8px}
h1{margin:0; font-size:clamp(28px,6.5vw,40px); line-height:1.08; font-weight:700; letter-spacing:-.025em; text-wrap:balance}
.lead{margin:0; color:var(--muted); max-width:54ch}

.btn{padding:8px 16px; border-radius:999px; font-weight:600; font-size:13px; background:var(--chip); border:1px solid var(--hair)}
.btn:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent); color:var(--accent-fg); border-color:transparent}
.btn.primary:hover:not(:disabled){color:var(--accent-fg); filter:brightness(1.07)}
a.btn{display:inline-block; text-decoration:none; color:inherit}
.linkbtn{color:var(--accent); font-weight:600; text-decoration:underline; text-underline-offset:3px}

.lb{overflow:hidden}
.tools{padding:14px 16px 0}
.tools .seg{max-width:400px}
.sortnote{margin:0; padding:10px 18px 12px; font-size:12px; color:var(--faint)}
.cols,.row{display:grid; grid-template-columns:44px minmax(0,1fr) 92px 92px; column-gap:12px; align-items:center; padding-inline:18px}
.cols{height:40px; border-block:1px solid var(--hair); font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.cols .hash{justify-self:center}
.th{display:inline-flex; align-items:center; gap:6px; justify-self:end; height:100%; color:var(--muted); letter-spacing:inherit; text-transform:inherit; font-weight:inherit; font-size:inherit}
.th:hover{color:var(--fg)}
.th[aria-pressed="true"]{color:var(--accent)}
.th .caret{font-size:8px; visibility:hidden}
.th[aria-pressed="true"] .caret{visibility:visible}
ol,ul{list-style:none; margin:0; padding:0}
.lb li{border-bottom:1px solid var(--hair)}
.lb li:last-child{border-bottom:0}
.row{width:100%; min-height:62px; text-align:left}
.row:hover{background:var(--chip)}
.row.me{background:var(--accent-soft)}
.divl{padding:8px 18px; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); background:var(--chip)}
.rk{width:28px; height:28px; display:grid; place-items:center; font-family:var(--f-num); font-size:13px; font-weight:500; color:var(--muted); border-radius:99px; font-variant-numeric:tabular-nums}
.rk.r1{background:linear-gradient(160deg,#F7D878,#DBAA2E); color:var(--medal-fg); box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.rk.r2{background:linear-gradient(160deg,#E4E9EC,#B5BEC4); color:var(--medal-fg); box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.rk.r3{background:linear-gradient(160deg,#E6AE82,#C07C4C); color:var(--medal-fg); box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.ch{display:flex; align-items:center; gap:12px; min-width:0}
.av{position:relative; overflow:hidden; flex:0 0 auto; width:36px; height:36px; display:grid; place-items:center; background:linear-gradient(155deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),var(--c); color:#fff; font-weight:700; font-size:14px; border-radius:11px; box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.av img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.nm{min-width:0; display:flex; flex-direction:column; line-height:1.25}
.nm b{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nm small{color:var(--faint); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.you{margin-left:6px; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); background:var(--accent-soft); padding:1px 6px; border-radius:999px; vertical-align:1px}
.val{display:flex; flex-direction:column; align-items:flex-end; line-height:1.25; font-family:var(--f-num); font-variant-numeric:tabular-nums}
.val b{font-weight:400; font-size:15px; color:var(--muted)}
.val.on b{font-weight:500; color:var(--fg)}
.val small{font-size:11px; color:var(--faint)}
.val.on small{color:var(--up)}
.val.on small.tot{color:var(--faint)}
.more{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:14px 18px; border-top:1px solid var(--hair); font-size:13px; color:var(--muted)}
.empty{padding:52px 24px; text-align:center; display:flex; flex-direction:column; gap:8px; align-items:center}
.empty b{font-size:16px}
.empty p{margin:0; color:var(--muted); max-width:42ch}

.find{position:relative; display:flex; flex-direction:column; gap:12px}
.sbox{display:flex; align-items:center; gap:10px; height:54px; padding:0 20px; border-radius:999px}
.sbox:focus-within{outline:2px solid var(--accent); outline-offset:2px}
.sbox svg{flex:0 0 auto; color:var(--faint)}
.sbox input{flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--fg); font:inherit; height:100%}
.sbox input::placeholder{color:var(--faint)}
.sug{position:absolute; top:60px; left:0; right:0; z-index:20; padding:6px; background:var(--glass-strong)}
.sug li button.pick{display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:14px; text-align:left}
.sug li button.pick:hover{background:var(--chip)}
.sug .av{width:30px; height:30px; font-size:12px; border-radius:9px}
.nomatch{padding:10px; font-size:13px; color:var(--muted); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.hint{padding:24px 22px; display:flex; flex-direction:column; gap:12px; align-items:flex-start}
.hint p{margin:0; color:var(--muted)}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; gap:8px; padding:6px 12px 6px 6px; border-radius:999px; background:var(--chip); border:1px solid var(--hair); font-size:13px; font-weight:600}
.chip:hover{border-color:var(--accent)}
.chip .av{width:24px; height:24px; font-size:11px; border-radius:8px}
.req{padding:20px 22px; display:flex; flex-direction:column; gap:10px; align-items:flex-start}
.req h3{margin:0; font-size:16px}
.req p{margin:0; color:var(--muted); max-width:56ch}

.res{display:flex; flex-direction:column; gap:14px}
.pfa{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.pfa .cap{flex-basis:100%}
.badge{font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); background:var(--accent-soft); padding:5px 12px; border-radius:999px}
.prof{display:flex; align-items:center; gap:14px; padding:16px 18px; flex-wrap:wrap}
.prof .av{width:54px; height:54px; border-radius:16px; font-size:21px}
.prof .nm{flex:1 1 160px}
.prof .nm b{font-size:19px}
.prof .desc{flex-basis:100%; margin:0; font-size:13px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px}
.tile{padding:16px 18px; display:flex; flex-direction:column; gap:2px; min-width:0}
.lbl{font-size:12px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}
.big{font-family:var(--f-num); font-weight:500; font-size:clamp(26px,7vw,36px); line-height:1.15; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.rank{font-size:13px; color:var(--muted)}
.rank strong{color:var(--accent); font-weight:600}
.ctrl{display:flex; flex-wrap:wrap; gap:10px}
.ctrl .seg{flex:1 1 240px}
.ctrl .seg.k{flex:0 1 250px}
.panel{padding:16px 18px; display:flex; flex-direction:column; gap:12px; min-width:0}
.ph{display:flex; justify-content:space-between; align-items:flex-start; gap:4px 12px; flex-wrap:wrap}
.ph h2,.panel h3{margin:0; font-size:15px; font-weight:600}
.ph p{margin:2px 0 0; font-size:13px; color:var(--muted)}
.tip{font-family:var(--f-num); font-size:12px; color:var(--muted)}
.chart{display:block; width:100%; height:auto; touch-action:pan-y}
.gridl{stroke:var(--hair); stroke-width:1}
.axis{fill:var(--faint); font-family:var(--f-num); font-size:10px}
.line{fill:none; stroke:var(--accent); stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round}
.dot{fill:var(--accent); stroke:var(--bg); stroke-width:2}
.xl{stroke:var(--faint); stroke-width:1; stroke-dasharray:3 3}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.grid2 .panel{gap:4px}
.mr{display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--hair)}
.gp{display:flex; flex-direction:column; align-items:flex-end; font-family:var(--f-num); font-variant-numeric:tabular-nums; line-height:1.25}
.gp b{font-weight:500; font-size:14px}
.gp small{font-size:11px; color:var(--faint)}
.gp small.hot{color:var(--fg); font-weight:500}
.none{margin:0; font-size:13px; color:var(--muted); padding-top:9px; border-top:1px solid var(--hair)}
.cap{margin:0; font-size:12px; color:var(--faint)}
.scroll{overflow-x:auto}
.tbl{width:100%; border-collapse:collapse; font-family:var(--f-num); font-size:13px; font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 8px; text-align:right; border-top:1px solid var(--hair); white-space:nowrap}
.tbl thead th{border-top:0; font-family:var(--f-body); font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}
.tbl th:first-child,.tbl td:first-child{text-align:left; padding-left:0}
.tbl tbody th{font-family:var(--f-body); font-weight:600}
.tbl td.rkc{color:var(--accent); font-weight:500}
.tbl tr.cur td,.tbl tr.cur th{background:var(--accent-soft)}
.x{width:32px; height:32px; border-radius:50%; color:var(--muted); font-size:20px; line-height:1; background:var(--chip)}
.x:hover{color:var(--fg)}

.cadd{position:relative}
.cadd .sbox{height:48px}
.clist{overflow:hidden}
.crow{display:grid; grid-template-columns:30px minmax(0,1fr) auto 32px; column-gap:10px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--hair)}
.crow:last-child{border-bottom:0}
.crow.me{background:var(--accent-soft)}
.crow .cnote{grid-column:2 / -1; margin:3px 0 0; font-size:12px; color:var(--muted)}
.crow .x{width:28px; height:28px; font-size:18px}

footer{font-size:12px; color:var(--faint); line-height:1.6; max-width:62ch}

@media (max-width:620px){
  .grid2{grid-template-columns:1fr}
}
@media (max-width:520px){
  .cols,.row{grid-template-columns:30px minmax(0,1fr) 66px 66px; column-gap:8px; padding-inline:14px}
  .av{width:32px; height:32px; font-size:13px}
  .ch{gap:9px}
  .val b{font-size:14px}
  .rk{width:26px; height:26px; font-size:12px}
  .tools{padding-inline:12px}
  .sortnote{padding-inline:14px}
  .tile,.panel,.prof{padding-inline:16px}
  .divl{padding-inline:14px}
}
@media (prefers-reduced-motion:reduce){
  .seg .thumb,.seg button{transition:none}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><b>Liga Kotak</b></div>
    <div class="ctl">
      <div class="seg glass mini" id="langSeg" role="group" aria-label="Language" style="--n:2;--i:0">
        <i class="thumb" aria-hidden="true"></i>
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ms" aria-pressed="false">BM</button>
      </div>
      <button type="button" class="glass icon" id="themeBtn" aria-label="Switch theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <nav class="seg glass main" id="mainTabs" role="tablist" style="--n:3;--i:0" data-ia="a_view" aria-label="View">
    <i class="thumb" aria-hidden="true"></i>
    <button type="button" role="tab" data-v="leaderboard" aria-selected="true" data-i="tab_lb"></button>
    <button type="button" role="tab" data-v="profile" aria-selected="false" data-i="tab_pf"></button>
    <button type="button" role="tab" data-v="compare" aria-selected="false" data-i="tab_cmp"></button>
  </nav>

  <div class="meta"><span class="tag" id="sampleTag" data-i="sample" hidden></span><span id="stamp"></span></div>

  <section class="view" id="v-leaderboard">
    <div class="hero">
      <h1 data-i="lb_h1"></h1>
      <p class="lead" data-i="lb_lead"></p>
    </div>
    <main class="glass lb">
      <div class="tools"><div class="seg" id="rangeSeg" role="group" data-ia="a_range" aria-label="Time range" style="--n:5;--i:0"></div></div>
      <p class="sortnote" id="sortnote"></p>
      <div class="cols" role="group" data-ia="a_sort" aria-label="Sort by">
        <span class="hash">#</span>
        <span data-i="col_ch"></span>
        <button type="button" class="th" data-k="subs" aria-pressed="true"><span data-i="col_subs"></span> <span class="caret" aria-hidden="true">▼</span></button>
        <button type="button" class="th" data-k="views" aria-pressed="false"><span data-i="col_views"></span> <span class="caret" aria-hidden="true">▼</span></button>
      </div>
      <ol id="board" aria-live="polite"></ol>
      <div class="more" id="more">
        <span id="count"></span>
        <button type="button" class="btn" id="moreBtn" data-i="more"></button>
      </div>
    </main>
  </section>

  <section class="view" id="v-profile" hidden>
    <div class="hero">
      <h1 data-i="pf_h1"></h1>
      <p class="lead" data-i="pf_lead"></p>
    </div>

    <div class="glass empty" id="sNone" hidden>
      <b data-i="none_t"></b>
      <p data-i="none_p"></p>
    </div>

    <div class="find" id="find">
      <div class="sbox glass">

  }
  function renderChart(c){
    var key=S.sKey, want=S.sRange==='all'?180:+S.sRange;
    var ago=seriesAgo(c,key), days=Math.min(want,ago.length-1), pts=[], d, k;
    if(days<2){
      CHS=null;
      $('#rChart').innerHTML='<div class="ph"><div><h2>'+t('g_title')+'</h2><p>'+t('no_hist')+'</p></div></div>';
      return;
    }
    for(d=days;d>=0;d--) pts.push(ago[d]);
    var min=Math.min.apply(null,pts), max=Math.max.apply(null,pts);
    var pad=(max-min)*0.15||max*0.02||1, lo=Math.max(0,min-pad), hi=max+pad;
    var pw=CH.W-CH.L-CH.R, ph=CH.H-CH.T-CH.B, n=pts.length;
    function X(i){return CH.L+pw*i/(n-1)}
    function Y(v){return CH.T+ph*(1-(v-lo)/(hi-lo))}
    var line='';
    for(k=0;k<n;k++) line+=(k?'L':'M')+X(k).toFixed(1)+' '+Y(pts[k]).toFixed(1);
    var base=(CH.T+ph).toFixed(1);
    var area=line+'L'+X(n-1).toFixed(1)+' '+base+'L'+X(0).toFixed(1)+' '+base+'Z';
    var grid='';
    for(k=0;k<=3;k++){
      var v=lo+(hi-lo)*k/3, y=Y(v).toFixed(1);
      grid+='<line class="gridl" x1="'+CH.L+'" x2="'+(CH.W-CH.R)+'" y1="'+y+'" y2="'+y+'"/>'+
            '<text class="axis" x="'+(CH.L-8)+'" y="'+(+y+3.5)+'" text-anchor="end">'+full(Math.round(v))+'</text>';
    }
    var gain=pts[n-1]-pts[0], rt=rtxtDays(days);
    CHS={pts:pts,days:days,X:X,Y:Y};
    $('#rChart').innerHTML=
      '<div class="ph"><div><h2>'+t('g_title')+'</h2><p>'+t('g_sub',{g:gfmt(gain),m:t('m_'+key),r:rt})+'</p></div>'+
      '<span class="tip" id="tip">'+t('today')+' · '+full(pts[n-1])+'</span></div>'+
      '<svg class="chart" viewBox="0 0 '+CH.W+' '+CH.H+'" role="img" aria-label="'+esc(c.name)+' '+t('m_'+key)+' '+rt+'">'+
        '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>'+
        grid+
        '<path d="'+area+'" fill="url(#ag)"/>'+
        '<path class="line" d="'+line+'"/>'+
        '<line class="xl" id="xl" y1="'+CH.T+'" y2="'+base+'" x1="0" x2="0" opacity="0"/>'+
        '<circle class="dot" id="xd" r="4.5" cx="0" cy="0" opacity="0"/>'+
        '<circle class="dot" r="4.5" cx="'+X(n-1).toFixed(1)+'" cy="'+Y(pts[n-1]).toFixed(1)+'"/>'+
        '<text class="axis" x="'+CH.L+'" y="'+(CH.H-8)+'">'+dayLabel(days)+'</text>'+
        '<text class="axis" x="'+(CH.W-CH.R)+'" y="'+(CH.H-8)+'" text-anchor="end">'+t('today')+'</text>'+
      '</svg>';
  }
  function chartTip(i){
    if(!CHS) return;
    var n=CHS.pts.length, xl=$('#xl'), xd=$('#xd'), tip=$('#tip');
    if(!xl||!xd||!tip) return;
    if(i===null){
      xl.setAttribute('opacity','0'); xd.setAttribute('opacity','0');
      tip.textContent=t('today')+' · '+full(CHS.pts[n-1]); return;
    }
    var x=CHS.X(i).toFixed(1);
    xl.setAttribute('x1',x); xl.setAttribute('x2',x); xl.setAttribute('opacity','1');
    xd.setAttribute('cx',x); xd.setAttribute('cy',CHS.Y(CHS.pts[i]).toFixed(1)); xd.setAttribute('opacity','1');
    tip.textContent=(i===n-1?t('today'):dayLabel(CHS.days-i))+' · '+full(CHS.pts[i]);
  }

  function mini(c,rank,key,sel,dir,range){
    var gap=dir==='up'?valR(c,key,range)-valR(sel,key,range):valR(sel,key,range)-valR(c,key,range);
    var note,hot=false;
    if(range==='all'){
      var diff=dir==='up'?perDay(sel,key)-perDay(c,key):perDay(c,key)-perDay(sel,key);
      if(diff>0){note=t(dir==='up'?'on_pace':'closing_n',{n:Math.max(1,Math.ceil(gap/diff))}); hot=true}
      else note=t(dir==='up'?'not_fast':'not_closing');
    }else{
      note=t('gained',{g:gfmt(valR(c,key,range))});
    }
    return '<div class="mr"><span class="rk">'+rank+'</span><span class="nm"><b>'+esc(c.name)+'</b><small>'+esc(c.handle)+'</small></span>'+
      '<span class="gp"><b>'+full(gap)+'</b><small class="'+(hot?'hot':'')+'">'+note+'</small></span></div>';
  }
  function renderRivals(c){
    var key=S.sKey, range=S.sRange;
    if(valR(c,key,range)==null){
      $('#rRivals').innerHTML='<div class="glass panel"><p class="none">'+t('no_hist')+'</p></div>';
      return;
    }
    var list=rankedR(key,range).filter(function(x){return valR(x,key,range)!=null});
    var i=list.indexOf(c), up='', down='', a, b;
    for(a=i-1;a>=Math.max(0,i-2);a--) up+=mini(list[a],a+1,key,c,'up',range);
    for(b=i+1;b<=Math.min(list.length-1,i+2);b++) down+=mini(list[b],b+1,key,c,'down',range);
    $('#rRivals').innerHTML=
      '<div class="grid2">'+
        '<section class="glass panel"><h3>'+t('to_overtake')+'</h3>'+(up||'<p class="none">'+t('none_up')+'</p>')+'</section>'+
        '<section class="glass panel"><h3>'+t('closing')+'</h3>'+(down||'<p class="none">'+t('none_down')+'</p>')+'</section>'+
      '</div>'+
      '<p class="cap">'+(range==='all'?t('cap_all',{m:t('m_'+key)}):t('cap_range',{m:t('m_'+key),r:rtxt(range)}))+'</p>';
  }
  function renderTable(c){
    var rows=[7,14,28,180].map(function(r){
      var k=String(r), rs=rankOf(c,'subs',k), rv=rankOf(c,'views',k);
      return '<tr'+(k===S.sRange?' class="cur"':'')+'><th scope="row">'+t('p_'+r)+'</th>'+
        '<td>'+gfmt(c.g.subs[r])+'</td><td class="rkc">'+(rs?'#'+rs:'—')+'</td>'+
        '<td>'+gfmt(c.g.views[r])+'</td><td class="rkc">'+(rv?'#'+rv:'—')+'</td></tr>';
    }).join('');
    $('#rTable').innerHTML=
      '<div class="ph"><div><h2>'+t('t_title')+'</h2><p>'+t('t_sub')+'</p></div></div>'+
      '<div class="scroll"><table class="tbl"><thead><tr><th>'+t('t_period')+'</th><th>'+t('t_subs')+'</th><th>'+t('t_rank')+'</th><th>'+t('t_views')+'</th><th>'+t('t_rank')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  function renderActions(){
    var c=S.pfC, m=S.pfMode, h='';
    if(m==='saved'){
      h='<span class="badge">'+t('my_profile')+'</span><button type="button" class="btn" id="exitBtn">'+t('exit')+'</button><p class="cap">'+t('saved_note')+'</p>';
    }else if(m==='preview'){
      h='<button type="button" class="btn primary" id="saveBtn">'+t('save')+'</button>';
    }else if(m==='view'){
      h='<button type="button" class="btn" id="backBtn">← '+t('back')+'</button>';
      if(S.savedId&&c.id!==S.savedId){
        var inC=S.compare.indexOf(c.id)>-1, full9=S.compare.length>=9;
        h+=inC?'<button type="button" class="btn" disabled>'+t('in_cmp')+'</button>'
              :full9?'<button type="button" class="btn" disabled>'+t('cmp_full')+'</button>'
              :'<button type="button" class="btn primary" id="addCmpBtn">'+t('add_cmp')+'</button>';
      }
    }
    $('#pfActions').innerHTML=h;
  }
  function renderPF(){
    var c=S.pfC; if(!c) return;
    renderActions();
    $('#rProf').innerHTML='<div class="glass prof">'+avatar(c)+'<span class="nm"><b>'+esc(c.name)+'</b><small>'+esc(c.handle)+(c.country?' · '+esc(c.country):'')+'</small></span>'+
      (c.description?'<p class="desc">'+esc(c.description)+'</p>':'')+'</div>';
    var tiles=['subs','views'].map(function(k){
      var rk=rankOf(c,k,'all');
      return '<div class="glass tile"><span class="lbl">'+t('mt_'+k)+'</span><b class="big">'+sig3(c[k])+'</b>'+
        '<span class="rank">'+t('rank_line',{r:rk,t:DATA.length})+'</span></div>';
    });
    if(c.videos!=null) tiles.push('<div class="glass tile"><span class="lbl">'+t('tile_videos')+'</span><b class="big">'+full(c.videos)+'</b></div>');
    $('#rTiles').innerHTML=tiles.join('');
    syncSeg($('#sKeySeg'),'data-sk',S.sKey);
    syncSeg($('#sRangeSeg'),'data-sr',S.sRange);
    renderChart(c); renderRivals(c); renderTable(c);
  }
  function showPF(host,c,mode){
    host.appendChild($('#pf'));
    $('#pf').hidden=false;
    S.pfC=c; S.pfMode=mode;
    renderPF();
  }

  function renderProfileTab(){
    var has=DATA.length>0, saved=savedChannel(), host=$('#pfHostProfile');
    $('#sNone').hidden=has;
    $('#find').hidden=!has||!!saved;
    if(!has){$('#pf').hidden=true;return}
    if(saved){
      showPF(host,saved,'saved');
    }else if(S.preview){
      $('#sEmpty').hidden=true;
      showPF(host,S.preview,'preview');
    }else{
      $('#pf').hidden=true;
      $('#sEmpty').hidden=false;
      $('#chips').innerHTML=rankedR('subs','all').slice(0,3).map(function(x){
        return '<button type="button" class="chip" data-pick="'+esc(x.id)+'">'+avatar(x)+esc(x.name)+'</button>';
      }).join('');
    }
  }

  function compareItems(){
    var me=savedChannel(), others=S.compare.map(function(id){return BYID[id]}).filter(function(c){return c&&c!==me});
    return {me:me,others:others};
  }
  function renderCompare(){
    var has=DATA.length>0, it=compareItems(), me=it.me;
    $('#cNeed').hidden=!!me&&has;
    $('#cMain').hidden=!me||!has;
    if(!has){
      $('#cNeed').hidden=false;
      return;
    }
    if(!me) return;
    var key=S.cKey, win=S.cWin, days=+win;
    syncSeg($('#cKeySeg'),'data-ck',key);
    syncSeg($('#cWinSeg'),'data-cw',win);
    var items=[me].concat(it.others).sort(function(a,b){return b[key]-a[key]||a.name.localeCompare(b.name)});
    var rate=function(c){var g=c.g[key][win]; return g==null?null:g/days};
    var rm=rate(me);
    $('#cSlots').textContent=it.others.length>=9?t('c_full'):t('c_slots',{n:it.others.length});
    $('#cList').innerHTML=items.map(function(c,i){
      var isMe=c===me, g=c.g[key][win], note;
      if(isMe){
        note=g==null?t('c_nodata'):t('c_me',{g:gfmt(g),m:t('m_'+key),r:rtxtDays(days)});
      }else{
        var ahead=c[key]>me[key], gap=Math.abs(c[key]-me[key]), ro=rate(c);
        if(rm==null||ro==null) note=t('c_nodata');
        else{
          var diff=ahead?rm-ro:ro-rm;
          if(ahead) note=diff>0?t('c_ahead_pass',{gap:full(gap),n:Math.max(1,Math.ceil(gap/diff))}):t('c_ahead_no',{gap:full(gap)});
          else note=diff>0?t('c_behind_pass',{gap:full(gap),n:Math.max(1,Math.ceil(gap/diff))}):t('c_behind_no',{gap:full(gap)});
        }
      }
      var chip=i<3?' r'+(i+1):'';
      return '<li class="crow'+(isMe?' me':'')+'">'+
        '<span class="rk'+chip+'">'+(i+1)+'</span>'+
        '<span class="ch">'+avatar(c)+'<span class="nm"><b>'+esc(c.name)+(isMe?'<span class="you">'+t('you')+'</span>':'')+'</b><small>'+esc(c.handle)+'</small></span></span>'+
        '<span class="val on"><b>'+sig3(c[key])+'</b><small class="tot">'+gfmt(g)+'</small></span>'+
        (isMe?'<span></span>':'<button type="button" class="x" data-rm="'+esc(c.id)+'" aria-label="'+t('rm')+'">×</button>')+
        '<p class="cnote">'+note+'</p></li>';
    }).join('');
    $('#cCap').textContent=it.others.length?t('c_cap',{r:rtxtDays(days)}):t('c_empty');
    $('#cq').disabled=it.others.length>=9;
  }
  function cmpExclude(){var me=savedChannel(); return S.compare.concat(me?[me.id]:[])}

  function applyStatic(){
    $$('[data-i]').forEach(function(e){e.textContent=t(e.dataset.i)});
    $$('[data-iph]').forEach(function(e){e.setAttribute('placeholder',t(e.dataset.iph))});
    $$('[data-ia]').forEach(function(e){e.setAttribute('aria-label',t(e.dataset.ia))});
    document.documentElement.lang=S.lang;
    $('#sampleTag').hidden=!S.sample;
    $('#footSample').textContent=S.sample?t('foot_sample'):'';
    $('#stamp').textContent=t('updated',{d:S.updated.toLocaleDateString(locale(),{day:'numeric',month:'short',year:'numeric'})});
    syncSeg($('#langSeg'),'data-lang',S.lang);
    var tb=$('#themeBtn'); tb.setAttribute('aria-label',t(S.theme==='dark'?'to_light':'to_dark'));
  }
  function applyTheme(){document.documentElement.setAttribute('data-theme',S.theme)}

  var VIEWS=['leaderboard','profile','compare','channel'];
  function setView(v){
    if(VIEWS.indexOf(v)<0) v='leaderboard';
    if(v==='channel'&&!S.viewing) v='leaderboard';
    S.view=v;
    VIEWS.forEach(function(n){$('#v-'+n).hidden=n!==v});
    $$('#mainTabs button').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.v===v||(v==='channel'&&b.dataset.v==='leaderboard')))});
    setSeg($('#mainTabs'),v==='profile'?1:v==='compare'?2:0);
    if(v!=='profile'&&v!=='channel') $('#pf').hidden=true;
    if(v==='leaderboard') renderBoard();
    else if(v==='profile') renderProfileTab();
    else if(v==='compare') renderCompare();
    else showPF($('#pfHostChannel'),S.viewing,'view');
  }
  function go(v){
    setView(v);
    try{if(location.hash!=='#'+v) location.hash=v}catch(e){}
  }
  function fromHash(){
    var h=''; try{h=(location.hash||'').replace('#','')}catch(e){}
    setView(h);
  }
  function rerender(){applyStatic();setView(S.view)}

  document.addEventListener('click',function(e){
    if(!e.target.closest('#find')) $('#sug').hidden=true;
    if(!e.target.closest('#cAdd')) $('#csug').hidden=true;
    var tg=e.target.closest('button'); if(!tg) return;
    var d=tg.dataset, id=tg.id;
    if(d.v){go(d.v);return}
    if(d.lang){S.lang=d.lang;store();rerender();return}
    if(id==='themeBtn'){S.theme=S.theme==='dark'?'light':'dark';applyTheme();store();applyStatic();return}
    if(d.open){var oc=BYID[d.open]; if(oc){S.viewing=oc;go('channel')} return}
    if(d.pick){var pc=BYID[d.pick]; if(pc) previewPick(pc); return}
    if(d.req){showReq();return}
    if(id==='reqBtn'){showReq();return}
    if(id==='saveBtn'){S.savedId=S.pfC.id;S.preview=null;S.compare=S.compare.filter(function(x){return x!==S.savedId});store();renderProfileTab();return}
    if(id==='exitBtn'){S.savedId=null;S.preview=null;$('#q').value='';store();renderProfileTab();return}
    if(id==='backBtn'){go('leaderboard');return}
    if(id==='addCmpBtn'){if(S.compare.indexOf(S.pfC.id)<0&&S.compare.length<9){S.compare.push(S.pfC.id);store()} renderPF();return}
    if(id==='goProfile'){go('profile');return}
    if(id==='moreBtn'){S.shown+=10;renderBoard();return}
    if(d.r){S.range=d.r;S.shown=10;renderBoard();return}
    if(d.k){S.key=d.k;S.shown=10;renderBoard();return}
    if(d.sk){S.sKey=d.sk;renderPF();return}
    if(d.sr){S.sRange=d.sr;renderPF();return}
    if(d.ck){S.cKey=d.ck;renderCompare();return}
    if(d.cw){S.cWin=d.cw;renderCompare();return}
    if(d.ci){
      if(d.ci!==S.savedId&&S.compare.indexOf(d.ci)<0&&S.compare.length<9&&BYID[d.ci]){S.compare.push(d.ci);store()}
      $('#cq').value='';$('#csug').hidden=true;renderCompare();return;
    }
    if(d.rm){S.compare=S.compare.filter(function(x){return x!==d.rm});store();renderCompare();return}
  });

  $('#q').addEventListener('input',function(){suggestInto($('#q'),$('#sug'),'data-pick',[],true)});
  $('#q').addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();var m=suggestInto($('#q'),$('#sug'),'data-pick',[],true);if(m.length)previewPick(m[0])}
    if(e.key==='Escape'){$('#sug').hidden=true}
  });
  $('#cq').addEventListener('input',function(){suggestInto($('#cq'),$('#csug'),'data-ci',cmpExclude(),false)});
  $('#cq').addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      e.preventDefault();
      var m=suggestInto($('#cq'),$('#csug'),'data-ci',cmpExclude(),false);
      if(m.length&&S.compare.length<9&&m[0].id!==S.savedId){S.compare.push(m[0].id);store();$('#cq').value='';$('#csug').hidden=true;renderCompare()}
    }
    if(e.key==='Escape'){$('#csug').hidden=true}
  });
  $('#rChart').addEventListener('pointermove',function(e){
    if(!CHS) return;
    var svg=this.querySelector('svg'); if(!svg) return;
    var rc=svg.getBoundingClientRect(), x=(e.clientX-rc.left)/rc.width*CH.W;
    var n=CHS.pts.length, i=Math.round((x-CH.L)/(CH.W-CH.L-CH.R)*(n-1));
    chartTip(Math.max(0,Math.min(n-1,i)));
  });
  $('#rChart').addEventListener('pointerleave',function(){chartTip(null)});
  window.addEventListener('hashchange',fromHash);

  function init(){
    DATA.forEach(function(c){BYID[c.id]=c});
    S.compare=S.compare.filter(function(id){return BYID[id]&&id!==S.savedId});
    if(S.savedId&&!BYID[S.savedId]) S.savedId=null;
    buildSeg($('#rangeSeg'),'data-r',RANGE_ITEMS);
    buildSeg($('#sRangeSeg'),'data-sr',RANGE_ITEMS);
    buildSeg($('#sKeySeg'),'data-sk',KEY_ITEMS);
    buildSeg($('#cKeySeg'),'data-ck',KEY_ITEMS);
    buildSeg($('#cWinSeg'),'data-cw',WIN_ITEMS);
    applyStatic();
    fromHash();
  }

  restore();
  applyTheme();

  // Utamakan baca fail data.json untuk sejarah harian & graf.
  // Jika fail tiada/gagal, guna fallback YouTube API secara live.
  fetch(CONFIG.dataUrl, { cache: 'no-store' })
    .then(function(res) {
      if (!res.ok) throw new Error("Gagal baca data.json");
      return res.json();
    })
    .then(function(j) {
      if (!j.channels || !j.channels.length) throw new Error("Kosong");
      DATA = j.channels.map(normalize);
      S.sample = false;
      S.updated = j.updated ? new Date(j.updated) : new Date();
      init();
    })
    .catch(function(err) {
      console.warn("Membaca terus dari YouTube API...", err);
      var ytUrl = 'https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=' + CHANNEL_IDS.join(',') + '&key=' + API_KEY;
      fetch(ytUrl)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data.items) return;
          DATA = data.items.map(function(item, index) {
            return normalize({
              i: index,
              id: item.id,
              name: item.snippet.title,
              handle: item.snippet.customUrl || ('@' + item.snippet.title.replace(/\s+/g, '').toLowerCase()),
              avatar: item.snippet.thumbnails.default ? item.snippet.thumbnails.default.url : null,
              description: item.snippet.description || "",
              country: item.snippet.country || "MY",
              subs: parseInt(item.statistics.subscriberCount || 0),
              views: parseInt(item.statistics.viewCount || 0),
              videos: parseInt(item.statistics.videoCount || 0)
            }, index);
          });
          S.sample = false;
          S.updated = new Date();
          init();
        })
        .catch(function() {
          DATA = [];
          init();
        });
    });
})();
</script>
</body>
</html>
